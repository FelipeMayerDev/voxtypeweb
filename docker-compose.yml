services:
  voxtypeweb:
    build: .
    user: "1000:1000"
    ports:
      - "8000:8000"
    environment:
      # Mount host data/config at their ORIGINAL host paths: index.db stores each
      # meeting's storage_path as a host-absolute path, and the voxtype CLI reads
      # transcript.json from it — so the paths must match the host inside the container.
      VOXTYPE_DATA_DIR: ${HOME}/.local/share/voxtype
      VOXTYPE_CONFIG_PATH: ${HOME}/.config/voxtype/config.toml
      VOXTYPE_STATE_DIR: /run/voxtype
      VOXTYPEWEB_STATE_DIR: ${HOME}/.local/state/voxtypeweb
      VOXTYPE_BIN: /usr/bin/voxtype
      # voxtype CLI locates index.db/config via XDG; point them at the host trees.
      XDG_DATA_HOME: ${HOME}/.local/share
      XDG_CONFIG_HOME: ${HOME}/.config
    volumes:
      - /usr/bin/voxtype:/usr/bin/voxtype:ro
      - /usr/lib/voxtype:/usr/lib/voxtype:ro
      - ${HOME}/.local/share/voxtype:${HOME}/.local/share/voxtype:ro
      - ${HOME}/.config/voxtype:${HOME}/.config/voxtype:rw
      - ${XDG_RUNTIME_DIR}/voxtype:/run/voxtype:ro
      # app-owned speaker aliases (not voxtype data)
      - ${HOME}/.local/state/voxtypeweb:${HOME}/.local/state/voxtypeweb:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
