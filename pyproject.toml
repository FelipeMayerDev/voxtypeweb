[project]
name = "voxtypeweb"
version = "0.1.0"
description = "Web interface for the voxtype CLI/TUI: config editing and meeting/transcript viewing."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "tomlkit>=0.13",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
